[pytest]
# No cache directory in the source tree; list the reason for every skipped test.
addopts = -p no:cacheprovider -ra
markers =
    mpi: needs the MPI launcher and the liballprof wrapper executables
    atlahs: needs the ATLAHS checkout and the atlahs_htsim build (BUILD_ATLAHS)
    recorded: needs recorded Nsight traces; takes up to two hours
